<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전주비전대학교 혁신지원사업 성과공유회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ── 색상: 기존 구글 사이트 테마색에 맞춰 --brand 값만 바꾸면 전체가 함께 바뀝니다 ── */
:root{
  --brand:#007BBF; --brand-dk:#005E93; --brand-lt:#E5F2FA; --hdr:#007BBF;
  --ink:#202124; --ink2:#3C4043; --mute:#5F6368; --line:#E1E5EA; --bg:#FFFFFF; --sub:#F5F7FA;
  --c-ov:var(--brand); --c-edu:var(--brand); --c-ind:var(--brand); --c-auto:var(--brand);
  --accent:var(--brand);
  --hdrH:56px; --tabH:60px; --chromeH:108px; --bottomUI:calc(var(--tabH) + env(safe-area-inset-bottom,0px));
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(var(--chromeH) + 10px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:16px;line-height:1.65;
  word-break:keep-all;padding-bottom:var(--bottomUI);overflow-x:clip}
img{max-width:100%;display:block}
a{color:inherit} button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #F9AB00;outline-offset:2px}

/* ── 상단 고정 영역(헤더 + 메뉴 + 이동바) ── */
.chrome{position:sticky;top:0;z-index:30;background:var(--bg)}
.top{background:var(--hdr);border-bottom:0}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:0 16px;height:var(--hdrH)}
.brand{display:flex;align-items:center;text-decoration:none;flex:none}
.brand img{height:44px;width:auto;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.pcnav{display:none;margin-left:auto;height:100%}
.pcnav > div{position:relative;height:100%;flex:none}
.pcnav a.top-link{display:flex;align-items:center;height:100%;padding:0 14px;text-decoration:none;font-size:15px;color:rgba(255,255,255,.9);
  white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.pcnav a.top-link:hover{color:#fff;background:rgba(255,255,255,.1)}
.pcnav a.top-link.on{color:#fff;border-bottom-color:#fff;font-weight:700}
.drop{position:absolute;top:100%;left:0;width:max-content;min-width:240px;max-width:min(360px,90vw);background:#fff;border:1px solid var(--line);
  border-radius:0 0 6px 6px;padding:6px 0;display:none;box-shadow:0 6px 20px rgba(32,33,36,.15)}
.pcnav > div:hover .drop,.pcnav > div:focus-within .drop{display:block}
.pcnav > div:nth-last-child(-n+2) .drop{left:auto;right:0}
.drop a{display:block;padding:9px 16px;text-decoration:none;font-size:14px;line-height:1.4}
.drop a:hover,.drop a.on{background:var(--brand-lt);color:var(--brand);font-weight:700}

/* 하단 탭(모바일·태블릿) */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(5,1fr)}
.tabs a{height:var(--tabH);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  text-decoration:none;font-size:12px;color:var(--mute);position:relative}
.tabs a svg{width:22px;height:22px}
.tabs a.on{color:var(--brand);font-weight:700;background:var(--brand-lt)}
.tabs a.on::before{content:"";position:absolute;top:0;left:18%;right:18%;height:3px;background:var(--brand);border-radius:0 0 3px 3px}
.tabs a:active{background:var(--sub)}

/* 상세 페이지 이동바 */
.bar{background:#fff;border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:0 auto;height:52px;display:flex;align-items:center;gap:8px;padding:0 12px}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:4px;border:1px solid var(--line);background:#fff;
  text-decoration:none;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:transform .1s,background .15s}
.btn:active{transform:scale(.96);background:var(--sub)}
.btn svg{width:16px;height:16px}
.btn.up{border-color:var(--brand);color:var(--brand)}
.btn.fill{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.fill:active{background:var(--brand-dk)}
.bar .prog{margin-left:auto;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}

/* ── 본문 ── */
main{max-width:1200px;margin:0 auto;padding:0 16px 40px}
.banner{margin:0 -16px;background:var(--sub)}
.banner img{width:100%;height:auto}
.title-band{margin:0 -16px;background:var(--brand);color:#fff;padding:22px 20px}
.title-band h1{color:#fff;margin:0}
.title-band p{margin:4px 0 0;opacity:.85;font-size:14px}
.crumb{font-size:13px;color:var(--mute);margin:16px 0 4px}
.crumb a{text-decoration:none}.crumb a:hover{text-decoration:underline}
h1{font-size:24px;line-height:1.35;margin:0 0 4px;color:var(--ink)}
h2{font-size:19px;margin:32px 0 12px;padding-left:10px;border-left:4px solid var(--brand)}
.lead{color:var(--mute);margin:0}
.hint{font-size:13px;color:var(--mute);margin:-4px 0 10px}


/* 홈 상단 통합 이미지 · 메뉴 상단 이미지 */
.slide.top-combo{line-height:0}
.slide.top-combo img{width:100%;height:auto;display:block}
.area-top{margin:16px 0 0;line-height:0}
.area-top picture{display:block}
.area-top img{width:100%;height:auto;border-radius:8px;display:block}
/* 홈 메뉴 버튼 */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.door{display:flex;flex-direction:column;justify-content:center;min-height:84px;padding:14px;border-radius:6px;text-decoration:none;
  background:var(--brand);color:#fff;transition:transform .12s,box-shadow .15s}
.door b{font-size:17px;line-height:1.3}
.door span{font-size:13px;opacity:.85;margin-top:2px}
.door:active,.door.tap{transform:scale(.97);box-shadow:0 0 0 3px var(--brand-lt),0 0 0 6px var(--brand)}
.survey{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:28px;padding:16px;background:var(--sub);border-radius:6px}
.survey p{margin:0;font-size:14px;color:var(--ink2)}


/* 이미지 링크 버튼(기존 구글 사이트 메뉴 이미지) — 돋보기가 아닌 손가락 커서 */
.imgbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.imgbtns.one{grid-template-columns:1fr;margin-top:12px}
.imgbtns.area{grid-template-columns:1fr;margin-top:16px}
.imgbtn{position:relative;display:flex;flex-direction:column;border-radius:8px;overflow:hidden;text-decoration:none;cursor:pointer;
  background:#fff;border:1px solid var(--line);transition:transform .12s,box-shadow .15s}
.imgbtn img{width:100%;height:auto;display:block}
.imgbtn .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.imgbtn.noimg{min-height:84px;background:var(--brand);justify-content:center;padding:14px}
.imgbtn.noimg img{display:none}
.imgbtn.noimg .lbl{position:static;width:auto;height:auto;clip:auto;color:#fff;font-weight:700;font-size:17px}
.imgbtn .cap{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:#fff}
.imgbtn .cap b{font-size:15px;color:var(--ink)} .imgbtn .cap small{font-size:12px;color:var(--mute);white-space:nowrap}
.imgbtn.noimg .cap{display:none}
.imgbtn:active,.imgbtn.tap{transform:scale(.97);box-shadow:0 0 0 3px var(--brand)}
.imgbtn:focus-visible{outline:3px solid #F9AB00;outline-offset:2px}
.home-main{margin-top:16px}
/* 영역 페이지 카드 */
.units{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px}
.unit{display:grid;grid-template-columns:128px 1fr;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;
  text-decoration:none;position:relative;transition:transform .12s,box-shadow .15s}
.unit .th{background:var(--sub) center/contain no-repeat;aspect-ratio:16/10}
.unit .tx{padding:12px 14px;display:flex;flex-direction:column;justify-content:center}
.unit .tx b{font-size:16px;line-height:1.4}
.unit .tx span{font-size:13px;color:var(--mute);margin-top:4px}
.unit:active,.unit.tap{transform:scale(.98);box-shadow:0 0 0 3px var(--brand)}
.seen{position:absolute;top:8px;right:8px;font-size:11px;font-weight:700;color:#fff;background:var(--brand);padding:1px 8px;border-radius:10px}

/* 세부과제 페이지 */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid button{position:relative;padding:0;border:2px solid transparent;border-radius:4px;background:var(--sub);cursor:pointer;aspect-ratio:16/9;overflow:hidden}
.grid button img{width:100%;height:100%;object-fit:contain}
.grid button span{position:absolute;left:4px;bottom:4px;background:rgba(32,33,36,.8);color:#fff;font-size:11px;padding:1px 6px;border-radius:3px}
.grid button:active{transform:scale(.96)}
.grid button.cur{border-color:var(--brand)}
.slides{display:flex;flex-direction:column;gap:20px}
.slide{margin:0;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;transition:box-shadow .3s}
.slide.flash{box-shadow:0 0 0 4px var(--brand)}
.slide button{display:block;width:100%;padding:0;border:0;background:var(--sub);cursor:zoom-in}
.slide button img{width:auto;max-width:100%;height:auto;margin:0 auto;min-height:120px;object-fit:contain;
  max-height:calc(100vh - var(--chromeH) - var(--bottomUI) - 24px)}
/* 이미지가 불러와지기 전 자리를 미리 잡아 썸네일 이동 시 위치가 밀리지 않도록 함 */
.slide button img:not(.ld){width:100%;aspect-ratio:16/9}
.slide figcaption{display:flex;justify-content:space-between;padding:8px 12px;font-size:13px;color:var(--mute)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:32px}
.pager a{display:block;border:1px solid var(--line);border-radius:6px;padding:12px 14px;text-decoration:none}
.pager a small{display:block;font-size:12px;color:var(--mute)}
.pager a b{font-size:14px;color:var(--brand)}
.pager a.next{text-align:right}
.foot-nav{display:flex;gap:8px;justify-content:center;margin-top:20px}

/* 확대 보기 */
.lb{position:fixed;inset:0;z-index:100;background:rgba(20,22,26,.95);display:none;flex-direction:column}
.lb.open{display:flex}
.lb-top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;color:#fff}
.lb-top span{font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-top a{color:#fff;font-size:13px;text-decoration:underline;white-space:nowrap}
.icon-btn{background:rgba(255,255,255,.14);border:0;color:#fff;width:44px;height:44px;border-radius:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.lb-stage{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pan-x pan-y pinch-zoom}
.lb-stage img{max-width:100%;max-height:calc(100vh - 140px);object-fit:contain}
.lb-nav{display:flex;justify-content:center;align-items:center;gap:24px;padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 14px)}
.lb-nav p{margin:0;color:rgba(255,255,255,.6);font-size:12px}
.totop{position:fixed;right:14px;bottom:calc(var(--bottomUI) + 14px);z-index:35;width:44px;height:44px;border-radius:22px;background:var(--brand);color:#fff;border:0;
  display:none;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.25);cursor:pointer}
.totop.show{display:flex}

/* ── 구글 사이트 삽입(iframe) 모드: 하단 고정 탭 대신 상단 메뉴줄 ── */
html.embed{--bottomUI:0px}
html.embed .tabs{position:static;border-top:0;border-bottom:1px solid var(--line);padding-bottom:0}
html.embed .tabs a{height:46px;flex-direction:row;gap:5px;font-size:13px}
html.embed .tabs a svg{width:16px;height:16px}
html.embed .tabs a.on::before{top:auto;bottom:0;border-radius:3px 3px 0 0}

/* 태블릿 600~1023px */
@media (min-width:600px){
  h1{font-size:28px}
  .doors{grid-template-columns:repeat(4,1fr)}
  .units{grid-template-columns:1fr 1fr}
  .imgbtns.area{grid-template-columns:1fr 1fr}
  .unit{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .grid{grid-template-columns:repeat(3,1fr)}
}
/* PC 1024px 이상 */
@media (min-width:1024px){
  :root{--hdrH:64px;--bottomUI:0px}
  body{padding-bottom:0}
  .tabs{display:none!important}
  .pcnav{display:flex}
  .brand img{height:52px}
  main{padding:0 24px 60px}
  .banner,.title-band{margin:0 -24px}
  .title-band{padding:28px 24px}
  .door{min-height:110px;padding:18px}
  .door b{font-size:19px}
  .units{grid-template-columns:repeat(3,1fr)}
  .imgbtns{grid-template-columns:repeat(4,1fr);gap:16px}
  .imgbtns.one{grid-template-columns:minmax(0,560px);justify-content:center}
  .imgbtns.area{grid-template-columns:repeat(2,1fr);gap:24px;max-width:1100px;margin-left:auto;margin-right:auto}
  .imgbtn:hover{box-shadow:0 0 0 3px var(--brand);transform:translateY(-2px)}
  .grid{grid-template-columns:repeat(5,1fr)}
  .slides{max-width:1040px;margin-left:auto;margin-right:auto;gap:28px}
  .totop{bottom:24px}
  /* ── PC 시인성 개선 ── */
  .area-top{max-width:1100px;margin:20px auto 0}
  .area-top img{box-shadow:0 2px 10px rgba(32,33,36,.12)}
  body{background:var(--sub);font-size:17px}
  .chrome{box-shadow:0 1px 4px rgba(32,33,36,.08)}
  .top{background:var(--hdr)}
  .bar{background:#fff}
  .pcnav a.top-link{font-size:16px;padding:0 16px;color:#fff}
  .bar-in{height:56px}
  .btn{height:40px;font-size:15px}
  h1{font-size:30px;margin-top:4px}
  h2{font-size:21px;margin:40px 0 14px}
  .crumb{font-size:14px;margin-top:22px}
  .lead,.hint{font-size:15px}
  /* 이미지 카드: 흰 바탕 + 그림자로 배경과 구분 */
  .slide{border:0;box-shadow:0 2px 10px rgba(32,33,36,.12)}
  .slide button{background:#fff}
  .slide.tall button img{max-height:none;width:100%;max-width:100%}
  .home-main{max-width:1040px}
  .grid{gap:10px}
  .grid button{background:#fff;box-shadow:0 1px 4px rgba(32,33,36,.12)}
  .grid button span{font-size:12px}
  .imgbtn{border:0;box-shadow:0 2px 8px rgba(32,33,36,.12)}
  .imgbtn .cap b{font-size:16px}
  .pager a,.foot-nav .btn{background:#fff}
  .door:hover{background:var(--brand-dk)}
  .unit:hover{box-shadow:0 0 0 2px var(--brand)}
}
@media (min-width:1440px){
  .slides,.home-main{max-width:1180px}
}
@media (min-width:1024px) and (max-width:1279px){
  .brand img{height:46px}
  .pcnav a.top-link{padding:0 10px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* ── 세부과제 버튼(메뉴 화면): 이미지 안에 제목이 있으므로 하단 제목 없이 이미지 카드만 표시 ── */
.area-wrap{max-width:1100px;margin:0 auto}
.imgbtns.area{gap:6px}
.imgbtns.area .imgbtn:active,.imgbtns.area .imgbtn.tap{box-shadow:none;transform:scale(.97)}
.imgbtns.area .imgbtn{background:transparent;border:0;border-radius:12px;box-shadow:none;transition:transform .15s}
.imgbtns.area .imgbtn img{width:100%;aspect-ratio:1600/360;object-fit:contain;background:transparent;mix-blend-mode:multiply}
@media (min-width:600px){
  .imgbtns.area{gap:16px}
  .imgbtns.area>.imgbtn:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - 8px)}
}
@media (min-width:1024px){
  .imgbtns.area{gap:20px 24px}
  .imgbtns.area>.imgbtn:last-child:nth-child(odd){width:calc(50% - 12px)}
  .imgbtns.area .imgbtn{border:0;box-shadow:none}
  .imgbtns.area .imgbtn:hover{box-shadow:none;transform:translateY(-3px)}
}
/* 홈 메뉴 버튼: 이미지 비율이 달라도 같은 크기·가운데 정렬 */
.imgbtns:not(.area):not(.one) .imgbtn img{aspect-ratio:16/9;object-fit:contain;background:#fff}
.imgbtns.home .imgbtn{background:#fff}
.imgbtns.home .imgbtn img{transform:translateY(var(--y,0%))}
</style>

<body>
<div class="chrome" id="chrome">
  <header class="top"><div class="top-in">
    <a class="brand" href="#/"><img id="logoImg" alt="전주비전대학교 VISION"><span class="sr">혁신지원사업 성과공유회 홈</span></a>
    <nav class="pcnav" id="pcnav" aria-label="주 메뉴"></nav>
  </div></header>
  <nav class="tabs" id="tabs" aria-label="메뉴"></nav>
  <div id="bar"></div>
</div>
<main id="app"></main>
<button class="totop" id="totop" aria-label="맨 위로"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 15l6-6 6 6"/></svg></button>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="슬라이드 확대 보기">
  <div class="lb-top"><span id="lbCount"></span><a id="lbOpen" href="#" target="_blank" rel="noopener">새 창으로 보기</a>
    <button class="icon-btn" id="lbClose" aria-label="닫기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="lb-stage" id="lbStage"><img id="lbImg" alt=""></div>
  <div class="lb-nav">
    <button class="icon-btn" id="lbPrev" aria-label="이전 슬라이드"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 6l-6 6 6 6"/></svg></button>
    <p>두 손가락으로 확대 · 좌우로 넘기기</p>
    <button class="icon-btn" id="lbNext" aria-label="다음 슬라이드"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
</div>

<script>
/* ==========================================================
   ▣ 콘텐츠 설정 — 이 부분만 수정하면 됩니다
   - images: 슬라이드 이미지 주소 목록 (위에서부터 순서대로 표시)
     · 구글 사이트 이미지: G('AMxu72...') 형태로 넣거나 전체 주소를 그대로 붙여넣기

/* 기존 사이트처럼 상단 메인 배너: 홈과 각 메뉴(사업개요·교육·산학·자율) 첫 화면에 표시 */
const areaTopHTML=a=>{const v=AREA_TOP[a.id];return v?`<div class="area-top"><picture><source media="(min-width:1024px)" srcset="${v.pc}"><img src="${v.m}" alt="${esc(a.name)} — 세부과제 ${a.units.length}개"></picture></div>`:''};
function paintHero(){}

const $=s=>document.querySelector(s);
function imgLoaded(im){im.classList.add('ld');if(im.naturalHeight>im.naturalWidth*0.9)im.closest('.slide')?.classList.add('tall');}
document.addEventListener('error',e=>{const im=e.target;if(im.tagName!=='IMG'||im.dataset.fb)return;
  const m=im.src.match(/lh3\.googleusercontent\.com\/d\/([\w-]+)=w(\d+)/);if(!m)return;
  im.dataset.fb='1';im.src='https://drive.google.com/thumbnail?id='+m[1]+'&sz=w'+m[2];},true);
const app=$('#app'),bar=$('#bar');
const EMBED=(()=>{try{return window.self!==window.top}catch(e){return true}})();
document.documentElement.classList.toggle('embed',EMBED);

const ICON={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
 overview:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
 edu:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',
 ind:'<path d="M3 21V10l6 3V9l6 3V5h6v16z"/>',
 auto:'<circle cx="12" cy="12" r="9"/><path d="M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18M3 12h18"/>',
 back:'<path d="M15 6l-6 6 6 6"/>'};
const svg=(k,w=22)=>`<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* 썸네일 크기 변환: 교체한 이미지(=w1601 등 끝자리 표시)는 썸네일 주소도 달라지게 해 예전 캐시가 보이지 않도록 함 */
const sized=(u,w)=>{const m=u.match(/=w(\d+)$/);return m?u.replace(/=w\d+$/,'=w'+(w+(+m[1]%10))):u};

/* 상단 고정 영역 높이 → 스크롤 위치·슬라이드 높이 계산에 사용 */
function syncChrome(){document.documentElement.style.setProperty('--chromeH',$('#chrome').offsetHeight+'px')}
addEventListener('resize',syncChrome);

/* 열람함 표시는 이번에 연 동안만 유지 — 새로 열면 모두 초기화 */
const seen=new Set();
function markSeen(k){seen.add(k)}

function drawNav(areaId,unitId){
  $('#tabs').innerHTML=`<a href="#/" class="${!areaId?'on':''}" ${!areaId?'aria-current="page"':''}>${svg('home')}<span>홈</span></a>`+
    AREAS.map(a=>`<a href="#/${a.id}" class="${a.id===areaId?'on':''}" ${a.id===areaId?'aria-current="page"':''}>${svg(a.id)}<span>${a.short}</span></a>`).join('');
  $('#pcnav').innerHTML=`<div><a class="top-link ${!areaId?'on':''}" href="#/">홈</a></div>`+
    AREAS.map(a=>`<div><a class="top-link ${a.id===areaId?'on':''}" href="#/${a.id}">${a.name}</a>`+
      (a.units?`<div class="drop">${a.units.map(u=>`<a href="#/${a.id}/${u.id}" class="${u.id===unitId?'on':''}">${esc(u.name)}</a>`).join('')}</div>`:'')+`</div>`).join('');
}
function drawBar(upHref,upLabel,prog){
  bar.innerHTML=upHref?`<div class="bar"><div class="bar-in">
    ${upHref==='#/'?`<a class="btn up" href="#/">${svg('back',16)}<span>홈으로</span></a>`:
      `<a class="btn up" href="${upHref}">${svg('back',16)}<span>${esc(upLabel)}</span></a><a class="btn" href="#/">${svg('home',16)}<span>홈</span></a>`}${prog?'<span class="prog" id="prog"></span>':''}</div></div>`:'';
}
const footNav=(upHref,upLabel)=>`<div class="foot-nav">${upHref==='#/'?`<a class="btn up" href="#/">${svg('back',16)}<span>홈으로</span></a>`:
  `<a class="btn up" href="${upHref}">${svg('back',16)}<span>${esc(upLabel)}</span></a><a class="btn" href="#/">${svg('home',16)}<span>홈</span></a>`}</div>`;

/* 구글 사이트 삽입 환경(샌드박스 iframe)에서는 주소(#) 이동이 막히므로,
   내부 링크를 가로채 페이지를 다시 불러오지 않고 화면만 전환 */
let CUR='';try{CUR=location.hash.replace(/^#\/?/,'')}catch(err){}
function go(path){CUR=path;try{history.pushState({p:path},'')}catch(err){}route();}
addEventListener('popstate',ev=>{CUR=(ev.state&&ev.state.p)||'';route();});
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#/"]');if(!a||e.metaKey||e.ctrlKey||e.shiftKey)return;
  e.preventDefault();const path=a.getAttribute('href').replace(/^#\/?/,'');
  if(a.matches('.door,.unit,.imgbtn')){a.classList.add('tap');setTimeout(()=>go(path),140)}else go(path);
});

const slideHTML=(s,i,n,label,cap)=>`<figure class="slide" id="s${i}"><button data-lb="${i}" aria-label="${esc(label)} ${i+1} 크게 보기"><img src="${s}" alt="${esc(label)} ${i+1}" loading="lazy" onload="imgLoaded(this)"></button>
</figure>`;

/* ── 기존 구글 사이트와 같은 링크 구성 ──
   홈: 1번 이미지 = 성과 요약(확대 보기), 2~6번 이미지 = 메뉴 버튼(아래 순서대로 연결)
   영역 페이지: 각 이미지 = 세부과제 버튼(세부과제 순서대로 연결)
   순서가 다르면 아래 HOME_LINKS의 i 값(0부터 시작)만 바꾸면 됩니다. */
const HOME_MAIN = [0];
/* y: 메뉴 버튼 이미지 속 제목 높이를 맞추기 위한 상하 이동값(%) — 이미지를 바꾸면 0으로 두거나 다시 조정 */
const HOME_LINKS = [
  {i:1, href:'#/overview', label:'사업개요', y:4.6},
  {i:2, href:'#/edu',      label:'교육 혁신', y:-4.6},
  {i:3, href:'#/ind',      label:'산학·지역 협력 혁신', y:0.7},
  {i:4, href:'#/auto',     label:'자율 혁신', y:8.6},
  {i:5, href:SURVEY,       label:'설문 참여', ext:true}
];
const imgBtn=(src,href,label,ext,extra='')=>`<a class="imgbtn" href="${href}"${ext?' target="_blank" rel="noopener"':''} aria-label="${esc(label)}${ext?' (새 창)':''}">
  ${src?`<img src="${src}" alt="" loading="lazy" onerror="this.parentNode.classList.add('noimg')">`:''}<span class="lbl">${esc(label)}</span>${extra}</a>`;

function viewHome(){
  drawNav(null);drawBar(null);
  const H=window.__HOME||(HOME_IMAGE?[HOME_IMAGE]:[]);
  const mains=HOME_MAIN.filter(i=>H[i]).map(i=>H[i]);
  const links=HOME_LINKS.filter(l=>!l.ext),ext=HOME_LINKS.filter(l=>l.ext);
  app.innerHTML=`
  <div class="slides home-main">
    <figure class="slide top-combo"><picture><source media="(min-width:1024px)" srcset="${TOP_PC}"><img src="${TOP_M}" alt="2026년 전문대학 혁신지원사업 성과공유회, 전주비전대학교 — 학생이 행복한 대학, 지역과 함께 성장하는 대학. 전주비전대학교의 혁신지원사업이 만들어낸 2026년의 변화와 성과를 지금 바로 만나보세요!"></picture></figure>
    ${mains.map((s,i)=>slideHTML(s,i,mains.length,'2026 혁신지원사업 성과 요약')).join('')}
  </div>
  <h2>메뉴 바로가기</h2>
  <div class="imgbtns home">${links.map(l=>imgBtn(H[l.i],l.href,l.label,false).replace('<img ','<img style="--y:'+(l.y||0)+'%" ')).join('')}</div>
  <div class="imgbtns one">${ext.map(l=>imgBtn(H[l.i],l.href,l.label,true)).join('')}</div>`;
  paintHero();
  bindLightbox(mains,'2026 혁신지원사업 성과 요약');
}

function viewArea(a){
  if(!a.units)return viewSlides(a,null);
  drawNav(a.id);drawBar('#/','홈으로',false);
  const imgs=a.images||[];
  app.innerHTML=`
    ${areaTopHTML(a)}
    <div class="area-wrap"><p class="crumb"><a href="#/">홈</a> › ${a.name}</p>
    ${AREA_TOP[a.id]?`<h1 class="sr">${a.name}</h1><p class="hint" style="margin:10px 0 0">버튼을 누르면 세부 내용으로 이동합니다.</p>`:`<h1>${a.name}</h1><p class="lead">세부과제 ${a.units.length}개 · 버튼을 누르면 세부 내용으로 이동합니다.</p>`}
    <div class="imgbtns area">${a.units.map((u,k)=>{const n=u.images.length;
      return imgBtn(imgs[k]||(n?sized(u.images[0],800):''),`#/${a.id}/${u.id}`,u.name,false,
        `${seen.has(a.id+'/'+u.id)?'<span class="seen">열람함</span>':''}`)}).join('')}</div>
    </div>
    ${footNav('#/','홈으로')}`;
  paintHero();
}

function viewSlides(a,u){
  const item=u||a,imgs=item.images||[],key=u?a.id+'/'+u.id:a.id;
  const upHref=u?'#/'+a.id:'#/',upLabel=u?a.name:'홈 화면';
  drawNav(a.id,u&&u.id);drawBar(upHref,upLabel,imgs.length>1);markSeen(key);
  const list=u?a.units:null,idx=list?list.indexOf(u):-1;
  const prev=idx>0?list[idx-1]:null,next=list&&idx<list.length-1?list[idx+1]:null;
  app.innerHTML=`
    <p class="crumb"><a href="#/">홈</a> › ${u?`<a href="#/${a.id}">${a.name}</a> › `:''}${esc(item.name)}</p>
    <h1>${esc(item.name)}</h1>
    ${!imgs.length?`<p class="lead" style="margin-top:16px">이 과제의 자료가 아직 등록되지 않았습니다.</p>`:
    `${imgs.length>1?`<h2>전체 한눈에 보기</h2><p class="hint">썸네일을 누르면 해당 내용으로 이동합니다.</p>
      <div class="grid" id="grid">${imgs.map((s,i)=>`<button data-go="${i}" aria-label="슬라이드 ${i+1}로 이동"><img src="${sized(s,480)}" data-full="${s}" alt="" loading="lazy"><span>${i+1}</span></button>`).join('')}</div>
      <h2>상세 보기</h2><p class="hint">이미지를 누르면 크게 볼 수 있습니다.</p>`:''}
    <div class="slides">${imgs.map((s,i)=>slideHTML(s,i,imgs.length,item.name,item.captions&&item.captions[i]?item.captions[i]:'슬라이드 '+(i+1))).join('')}</div>`}
    ${list?`<nav class="pager" aria-label="이전·다음 과제">
      ${prev?`<a href="#/${a.id}/${prev.id}"><small>이전 과제</small><b>${esc(prev.name)}</b></a>`:'<span></span>'}
      ${next?`<a class="next" href="#/${a.id}/${next.id}"><small>다음 과제</small><b>${esc(next.name)}</b></a>`:'<span></span>'}</nav>`:''}
    ${footNav(upHref,upLabel)}`;
  app.querySelectorAll('#grid img').forEach(im=>im.addEventListener('error',()=>{if(im.src!==im.dataset.full)im.src=im.dataset.full},{once:true}));
  app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{
    const el=$('#s'+b.dataset.go);el.scrollIntoView({behavior:'smooth',block:'start'});
    [700,1400].forEach(t=>setTimeout(()=>{const y=el.getBoundingClientRect().top,c=$('#chrome').offsetHeight;if(Math.abs(y-c-10)>4)el.scrollIntoView({block:'start'})},t));
    el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1200)}));
  if(imgs.length>1){
    const prog=$('#prog'),btns=app.querySelectorAll('[data-go]');prog.textContent='목록';
    const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){const i=+en.target.id.slice(1);
      prog.textContent=`${i+1} / ${imgs.length}`;btns.forEach((b,j)=>b.classList.toggle('cur',j===i))}}),{rootMargin:'-45% 0px -50% 0px'});
    app.querySelectorAll('.slide').forEach(s=>io.observe(s));
  }
  paintHero();
  bindLightbox(imgs,item.name);
}

let LB={imgs:[],i:0,title:''};
function bindLightbox(imgs,title){app.querySelectorAll('[data-lb]').forEach(b=>b.addEventListener('click',()=>openLb(imgs,+b.dataset.lb,title)))}
function openLb(imgs,i,title){LB={imgs,i,title};showLb();$('#lb').classList.add('open');document.body.style.overflow='hidden';$('#lbClose').focus()}
function showLb(){$('#lbImg').src=LB.imgs[LB.i];$('#lbImg').alt=LB.title+' '+(LB.i+1);$('#lbOpen').href=LB.imgs[LB.i];
  $('#lbCount').textContent=`${LB.title} · ${LB.i+1} / ${LB.imgs.length}`;
  $('#lbPrev').style.visibility=LB.i>0?'visible':'hidden';$('#lbNext').style.visibility=LB.i<LB.imgs.length-1?'visible':'hidden'}
function closeLb(){$('#lb').classList.remove('open');document.body.style.overflow='';const el=$('#s'+LB.i);if(el)el.scrollIntoView({block:'start'})}
function stepLb(d){const n=LB.i+d;if(n>=0&&n<LB.imgs.length){LB.i=n;showLb()}}
$('#lbClose').onclick=closeLb;$('#lbPrev').onclick=()=>stepLb(-1);$('#lbNext').onclick=()=>stepLb(1);
addEventListener('keydown',e=>{if(!$('#lb').classList.contains('open'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')stepLb(-1);if(e.key==='ArrowRight')stepLb(1)});
let sx=null,multi=false;
$('#lbStage').addEventListener('touchstart',e=>{multi=e.touches.length>1;sx=multi?null:e.touches[0].clientX},{passive:true});
$('#lbStage').addEventListener('touchend',e=>{if(multi||sx===null||(window.visualViewport&&visualViewport.scale>1.05))return;
  const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60)stepLb(dx<0?1:-1);sx=null},{passive:true});

const tt=$('#totop');addEventListener('scroll',()=>tt.classList.toggle('show',scrollY>900),{passive:true});
tt.onclick=()=>scrollTo({top:0,behavior:'smooth'});

function route(){
  if($('#lb').classList.contains('open')){$('#lb').classList.remove('open');document.body.style.overflow=''}
  const [aid,uid]=CUR.split('/').filter(Boolean);
  const a=AREAS.find(x=>x.id===aid);
  if(!a)viewHome();else if(uid){const u=(a.units||[]).find(x=>x.id===uid);u?viewSlides(a,u):viewArea(a)}else viewArea(a);
  syncChrome();scrollTo(0,0);trackView();
}
/* 조회수 기록: 화면(메뉴·세부과제)이 바뀔 때마다 GA4에 page_view 전송 */
let LAST_PV='';
function trackView(){
  try{
    if(typeof gtag!=='function')return;
    const [aid,uid]=CUR.split('/').filter(Boolean);
    const a=AREAS.find(x=>x.id===aid),u=a&&uid?(a.units||[]).find(x=>x.id===uid):null;
    const name=!a?'홈':(u?a.name+' > '+u.name:a.name);
    const key=CUR||'home';if(key===LAST_PV)return;LAST_PV=key;
    const base=location.origin+location.pathname;
    gtag('event','page_view',{page_title:name+' | 혁신지원사업 성과공유회',page_location:base+(CUR?'?menu='+encodeURIComponent(CUR):''),page_path:location.pathname+(CUR?'?menu='+CUR:'')});
  }catch(e){}
}
document.addEventListener('click',e=>{const a=e.target.closest('a[target="_blank"]');if(!a||typeof gtag!=='function')return;
  try{gtag('event','click_outbound',{link_url:a.href,link_text:(a.getAttribute('aria-label')||a.textContent||'').trim().slice(0,60)})}catch(err){}});

try{history.replaceState({p:CUR},'')}catch(err){}
route();
</script>
</body>
